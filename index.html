<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Групповой P2P Мессенджер</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; color: #333; }
        
        /* Экраны авторизации */
        .modal-bg { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index: 10; }
        .auth-card { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); text-align: center; }
        .auth-card h2 { margin-bottom: 15px; color: #075e54; }
        .auth-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .auth-card button { width: 100%; padding: 12px; background: #128c7e; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .auth-card button:hover { background: #075e54; }

        /* Шапка чата */
        header { background: #075e54; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .user-info { font-size: 14px; }
        .room-info { font-weight: bold; font-size: 16px; background: #128c7e; padding: 5px 12px; border-radius: 15px; }

        /* Окно чата */
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #e5ddd5; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 8px; font-size: 15px; word-break: break-word; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg .sender { font-size: 11px; font-weight: bold; color: #128c7e; margin-bottom: 3px; block; }
        .me { background: #dcf8c6; align-self: flex-end; }
        .interlocutor { background: white; align-self: flex-start; }
        .system { background: #fff3cd; color: #856404; align-self: center; font-size: 12px; box-shadow: none; }

        /* Поле ввода */
        footer { background: #f0f0f0; padding: 12px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        footer input { flex: 1; border: 1px solid #ccc; border-radius: 24px; padding: 12px 20px; font-size: 15px; outline: none; }
        footer button { background: #128c7e; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        footer button:hover { background: #075e54; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Шаг 1: Регистрация Юзера -->
    <div id="reg-screen" class="modal-bg">
        <div class="auth-card">
            <h2>Регистрация</h2>
            <p>Придумайте никнейм для общения</p>
            <input type="text" id="username-input" placeholder="Ваше имя / Никнейм">
            <button onclick="registerUser()">Войти</button>
        </div>
    </div>

    <!-- Шаг 2: Выбор или создание группы -->
    <div id="group-screen" class="modal-bg hidden">
        <div class="auth-card">
            <h2>Групповые комнаты</h2>
            <p>Введите название группы, чтобы создать её или войти</p>
            <input type="text" id="room-input" placeholder="Например: family-chat-2026">
            <button onclick="joinGroup()">Войти в группу</button>
        </div>
    </div>

    <!-- Основной экран чата -->
    <header>
        <div class="user-info">Вы: <strong id="display-name">...</strong></div>
        <div class="room-info" id="display-room">Комната</div>
    </header>

    <div id="chat-box">
        <div class="msg system">Добро пожаловать в групповой P2P чат!</div>
    </div>

    <footer>
        <input type="text" id="message-input" placeholder="Напишите сообщение..." onkeypress="checkEnter(event)">
        <button onclick="sendMessage()">➔</button>
    </footer>

    <script>
        let myUsername = localStorage.getItem('chat_username') || '';
        let currentRoom = '';
        let peer = null;
        let connections = []; // Здесь хранятся активные участники группы

        // Проверяем, зарегистрирован ли уже юзер
        window.onload = () => {
            if (myUsername) {
                document.getElementById('reg-screen').classList.add('hidden');
                document.getElementById('group-screen').classList.remove('hidden');
                document.getElementById('display-name').innerText = myUsername;
            }
        };

        // 1. Регистрация пользователя
        function registerUser() {
            const input = document.getElementById('username-input').value.trim();
            if (!input) return alert('Введите корректный никнейм!');
            
            myUsername = input;
            localStorage.setItem('chat_username', myUsername); // сохраняем в браузере
            document.getElementById('display-name').innerText = myUsername;
            
            document.getElementById('reg-screen').classList.add('hidden');
            document.getElementById('group-screen').classList.remove('hidden');
        }

        // 2. Подключение к группе (комнате)
        function joinGroup() {
            const roomInput = document.getElementById('room-input').value.trim();
            if (!roomInput) return alert('Введите название группы!');
            
            currentRoom = roomInput.toLowerCase();
            document.getElementById('display-room').innerText = `Группа: ${currentRoom}`;
            document.getElementById('group-screen').classList.add('hidden');

            // Инициализируем PeerJS. В качестве ID используем комбинацию комнаты и ника
            // Это позволит участникам одной комнаты находить друг друга по префиксу
            const uniquePeerId = `p2proom-${currentRoom}-${myUsername}-${Math.floor(Math.random() * 1000)}`;
            peer = new Peer(uniquePeerId);

            peer.on('open', (id) => {
                appendMessage('Система', `Вы подключились к комнате как ${myUsername}. Поиск участников...`, 'system');
                
                // Ищем других участников в сети (имитируем комнату через сканирование доступных ID на сервере PeerJS)
                // Для простоты — мы подключаемся к списку активных пиров.
                // В реальном времени WebRTC запрашивает окружение:
                discoverPeers();
            });

            // Ловим входящие подключения от новых участников группы
            peer.on('connection', (conn) => {
                handleConnection(conn);
            });
        }

        // Автоматический поиск участников в той же комнате
        function discoverPeers() {
            // Запрашиваем у облака PeerJS список всех подключений (хак для комнат)
            peer.listAllPeers((peers) => {
                peers.forEach((peerId) => {
                    // Если пир принадлежит нашей комнате и это не мы сами — подключаемся
                    if (peerId.startsWith(`p2proom-${currentRoom}-`) && peerId !== peer.id) {
                        let conn = peer.connect(peerId);
                        handleConnection(conn);
                    }
                });
            });
        }

        // Обработка логики сообщений и обмена данными
        function handleConnection(conn) {
            // Проверяем дубликаты
            if (connections.find(c => c.peer === conn.peer)) return;
            
            connections.push(conn);

            conn.on('open', () => {
                // Извлекаем имя друга из его ID
                const parts = conn.peer.split('-');
                const friendName = parts[2] || 'Участник';
                appendMessage('Система', `${friendName} вошел в чат`, 'system');
            });

            conn.on('data', (data) => {
                // Получаем объект { sender: 'Ник', text: 'Привет' }
                if (data.sender && data.text) {
                    appendMessage(data.sender, data.text, 'interlocutor');
                }
            });

            conn.on('close', () => {
                connections = connections.filter(c => c.peer !== conn.peer);
                const parts = conn.peer.split('-');
                const friendName = parts[2] || 'Участник';
                appendMessage('Система', `${friendName} покинул чат`, 'system');
            });
        }

        // 3. Отправка сообщения ВСЕМ участникам группы
        function sendMessage() {
            const msgInput = document.getElementById('message-input');
            const text = msgInput.value.trim();
            if (!text) return;

            const messageData = {
                sender: myUsername,
                text: text
            };

            // Рассылаем сообщение каждому, кто сейчас в нашей группе
            connections.forEach(conn => {
                if (conn.open) {
                    conn.send(messageData);
                }
            });

            appendMessage('Вы', text, 'me');
            msgInput.value = '';
        }

        // Отрисовка сообщений в интерфейсе
        function appendMessage(sender, text, type) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg', type);

            if (type !== 'system') {
                const senderSpan = document.createElement('span');
                senderSpan.classList.add('sender');
                senderSpan.innerText = sender;
                msgDiv.appendChild(senderSpan);
            }

            const textNode = document.createTextNode(text);
            msgDiv.appendChild(textNode);
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Раз в 7 секунд ищем новых людей, кто зашел в эту же комнату
        setInterval(() => {
            if (peer && !peer.destroyed) {
                discoverPeers();
            }
        }, 7000);
    </script>
</body>
</html>
