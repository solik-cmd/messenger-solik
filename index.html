<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced TG Messenger</title>
    <!-- Подключаем Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --tg-theme: #2481cc;
            --bg-main: #0e1621;
            --bg-dark: #17212b;
            --bg-active: #2b5278;
            --text-main: #f5f5f5;
            --text-muted: #7f91a4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Окно авторизации (сделано как стандартная форма для сохранения паролей браузером) */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .auth-form { background: var(--bg-dark); padding: 30px; border-radius: 10px; width: 100%; max-width: 360px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .auth-form h2 { text-align: center; margin-bottom: 20px; color: var(--tg-theme); }
        .auth-form input, .auth-form select { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-main); border: 1px solid #2f3844; border-radius: 6px; color: white; font-size: 16px; }
        .auth-form button { width: 100%; padding: 12px; background: var(--tg-theme); border: none; border-radius: 6px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .auth-form .toggle-type { text-align: center; color: var(--text-muted); margin-top: 15px; cursor: pointer; font-size: 14px; }

        /* Главный интерфейс а-ля Telegram */
        .sidebar { width: 320px; background: var(--bg-dark); border-right: 1px solid #101921; display: flex; flex-direction: column; }
        .sb-header { padding: 15px; border-bottom: 1px solid #101921; }
        .search-bar { width: 100%; padding: 8px 12px; background: var(--bg-main); border: 1px solid #24303f; border-radius: 20px; color: white; outline: none; }
        
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #101921; }
        .chat-item:hover, .chat-item.active { background: var(--bg-active); }
        
        .main-chat { flex: 1; display: flex; flex-direction: column; background: #0e1621; }
        .chat-header { height: 60px; background: var(--bg-dark); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #101921; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Стилизация сообщений по ролям и цветам */
        .message { max-width: 65%; padding: 10px 14px; border-radius: 8px; position: relative; display: flex; flex-direction: column; }
        .msg-meta { font-size: 11px; font-weight: bold; margin-bottom: 3px; display: flex; gap: 5px; align-items: center; }
        .msg-text { word-break: break-word; font-size: 15px; }
        .fwd-label { font-size: 11px; color: var(--text-muted); font-style: italic; margin-bottom: 2px; }

        /* Цвета ролей */
        .role-owner { color: #ffd700 !important; } /* Владелец - золотой */
        .role-admin { color: #ff4d4d !important; } /* Админ - красный */
        .role-premium { color: #b388ff !important; } /* Премиум - фиолетовый */
        .role-vip-blue { color: #33b5e5 !important; } /* VIP синий */
        .role-vip-green { color: #00c851 !important; } /* VIP зеленый */
        .role-user { color: #aab8c2 !important; }

        .m-incoming { background: #182533; align-self: flex-start; }
        .m-outgoing { background: #2b5278; align-self: flex-end; }

        .chat-input-area { padding: 15px; background: var(--bg-dark); display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px; background: var(--bg-main); border: 1px solid #24303f; border-radius: 8px; color: white; outline: none; }
        .chat-input-area button { padding: 0 20px; background: var(--tg-theme); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }

        /* Панель управления Владельца / Админа */
        .admin-panel { background: #202b36; padding: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-around; font-size: 13px; }
        .btn-action { padding: 4px 10px; background: #c62828; border: none; border-radius: 4px; color: white; cursor: pointer; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА / РЕГИСТРАЦИИ -->
    <div id="auth-screen" class="auth-overlay">
        <!-- autocomplete="on" заставляет браузер предлагать сохранение пароля -->
        <form class="auth-form" id="main-auth-form" autocomplete="on" onsubmit="handleAuth(event)">
            <h2 id="auth-title">Войти в Telegram</h2>
            
            <input type="text" id="auth-username" name="username" placeholder="Имя пользователя (Никнейм)" required autocomplete="username">
            <input type="password" id="auth-password" name="password" placeholder="Пароль" required autocomplete="current-password">
            
            <!-- Поля, видимые только при регистрации -->
            <div id="reg-fields" class="hidden">
                <label style="font-size:12px; color:var(--text-muted)">Роль (для теста лимитов):</label>
                <select id="auth-role" onchange="toggleVipColors()">
                    <option value="user">Обычный юзер (Лимит: 1 акк на IP)</option>
                    <option value="vip">VIP роль (Лимит: 3 акка на IP)</option>
                    <option value="premium">Premium роль</option>
                </select>
                
                <div id="vip-color-selector" class="hidden">
                    <label style="font-size:12px; color:var(--text-muted)">Цвет вашего ника (Только для VIP):</label>
                    <select id="auth-vip-color">
                        <option value="blue">Синий цвет</option>
                        <option value="green">Зеленый цвет</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="auth-btn">Войти</button>
            <div class="toggle-type" id="auth-toggle" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</div>
        </form>
    </div>

    <!-- ЛЕВАЯ ПАНЕЛЬ (СПИСОК ГРУПП И ПОИСК ИГРОКОВ) -->
    <div class="sidebar">
        <div class="sb-header">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:14px;">
                <span id="my-profile-name">Загрузка...</span>
                <span style="color:var(--text-muted); cursor:pointer;" onclick="logout()">Выйти ➔</span>
            </div>
            <input type="text" class="search-bar" id="search-input" placeholder="Поиск игрока или группы..." oninput="filterList()">
            <button onclick="createNewGroup()" style="width:100%; margin-top:8px; padding:6px; background:#2b5278; border:none; border-radius:4px; color:white; font-size:12px; cursor:pointer;">+ Создать группу/канал</button>
        </div>
        <div class="chat-list" id="chat-list-container">
            <!-- Сюда рендерятся комнаты и игроки -->
        </div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН ЧАТА -->
    <div class="main-chat">
        <!-- Панель Администратора / Владельца -->
        <div id="admin-bar" class="admin-panel hidden">
            <span>👑 Панель управления:</span>
            <button class="btn-action" onclick="adminCreateAccount()">Создать аккаунт админу</button>
            <button class="btn-action" style="background:#1565c0" onclick="adminGiveRole()">Выдать VIP/Админку</button>
        </div>

        <div class="chat-header">
            <div>
                <h3 id="current-chat-title">Выберите чат</h3>
                <span id="current-chat-status" style="font-size:12px; color:var(--text-muted)"></span>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages-container">
            <!-- Сообщения -->
        </div>

        <div class="chat-input-area">
            <input type="text" id="chat-message-input" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendChatMessage()">
            <button onclick="sendChatMessage()">Отправить</button>
        </div>
    </div>

    <script>
        // !!! ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ИЗ КОНСОЛИ FIREBASE !!!
        const firebaseConfig = {
            apiKey: "AIzaSyYourActualApiKeyHere",
            authDomain: "your-app.firebaseapp.com",
            databaseURL: "https://your-app-default-rtdb.firebaseio.com",
            projectId: "your-app",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:12345:web:12345"
        };
        
        // Инициализация
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isLoginMode = true;
        let currentUser = null;
        let currentChatId = "global_room";
        let userIp = "127.0.0.1";

        // Получаем IP пользователя при загрузке страницы
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => userIp = data.ip)
            .catch(() => userIp = "127.0.0.1");

        // Вшитый аккаунт владельца
        const OWNER_NICK = "неон";
        const OWNER_PASS = "qwsder";

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Войти в Telegram" : "Регистрация";
            document.getElementById('auth-btn').innerText = isLoginMode ? "Войти" : "Создать аккаунт";
            document.getElementById('auth-toggle').innerText = isLoginMode ? "Нет аккаунта? Зарегистрироваться" : "Уже есть аккаунт? Войти";
            document.getElementById('reg-fields').classList.toggle('hidden', isLoginMode);
        }

        function toggleVipColors() {
            const role = document.getElementById('auth-role').value;
            document.getElementById('vip-color-selector').classList.toggle('hidden', role !== 'vip');
        }

        // Авторизация и Логика Лимитов по IP
        function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            
            if (!username || !password) return alert("Заполните поля!");

            if (isLoginMode) {
                // Проверка входа (включая владельца)
                if (username === OWNER_NICK && password === OWNER_PASS) {
                    initUser({ username: OWNER_NICK, role: 'owner', vipColor: 'gold' });
                    return;
                }

                db.ref('users/' + username).once('value', (snapshot) => {
                    const user = snapshot.val();
                    if (user && user.password === password) {
                        initUser(user);
                    } else {
                        alert("Неверный никнейм или пароль!");
                    }
                });
            } else {
                // Регистрация нового аккаунта
                if (username === OWNER_NICK) return alert("Этот ник зарезервирован владельцем!");

                const selectedRole = document.getElementById('auth-role').value;
                const vipColor = selectedRole === 'vip' ? document.getElementById('auth-vip-color').value : 'none';

                // Сканируем базу данных на лимиты аккаунтов по текущему IP
                db.ref('users').once('value', (snapshot) => {
                    let ipCount = 0;
                    snapshot.forEach((child) => {
                        if (child.val().ip === userIp) ipCount++;
                    });

                    // Проверка жестких правил лимитов
                    let maxAllowed = 1; // Обычный юзер
                    if (selectedRole === 'vip') maxAllowed = 3;
                    if (selectedRole === 'premium') maxAllowed = 5;

                    if (ipCount >= maxAllowed) {
                        alert(`Превышен лимит аккаунтов для вашего IP! Для вашей роли доступно максимум: ${maxAllowed}`);
                        return;
                    }

                    // Сохраняем аккаунт в базу данных
                    const newUser = { username, password, role: selectedRole, vipColor, ip: userIp, status: "online" };
                    db.ref('users/' + username).set(newUser, (err) => {
                        if (!err) {
                            alert("Регистрация успешна!");
                            initUser(newUser);
                        }
                    });
                });
            }
        }

        function initUser(user) {
            currentUser = user;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('my-profile-name').innerText = `${user.username} (${user.role.toUpperCase()})`;
            
            // Если зашел владелец или админ — показываем скрытую панель управления
            if (user.role === 'owner' || user.role === 'admin') {
                document.getElementById('admin-bar').classList.remove('hidden');
            }

            // Ставим статус "В сети"
            if (user.username !== OWNER_NICK) {
                db.ref('users/' + user.username + '/status').set('online');
            }

            loadChatList();
            listenToChat(currentChatId);
        }

        function logout() {
            if (currentUser && currentUser.username !== OWNER_NICK) {
                db.ref('users/' + currentUser.username + '/status').set('был в сети недавно');
            }
            location.reload();
        }

        // Загрузка комнат и Поиск игроков
        function loadChatList() {
            db.ref('channels').on('value', (snapshot) => {
                const container = document.getElementById('chat-list-container');
                container.innerHTML = `<div class="chat-item active" onclick="switchChat('global_room', 'Общий чат')">🌍 Общий чат</div>`;
                
                snapshot.forEach((child) => {
                    const room = child.val();
                    container.innerHTML += `<div class="chat-item" onclick="switchChat('${child.key}', '${room.name}')">💬 ${room.name}</div>`;
                });
            });
        }

        function createNewGroup() {
            const name = prompt("Введите название новой группы/канала:");
            if (!name) return;
            const roomId = 'room_' + Date.now();
            db.ref('channels/' + roomId).set({ name: name, creator: currentUser.username });
        }

        // Поиск игроков и фильтрация списка (из ТГ)
        function filterList() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            if (query.length > 2) {
                // Ищем игроков прямо в базе данных
                db.ref('users').orderByKey().startAt(query).endAt(query + "\uf8ff").once('value', (snapshot) => {
                    const container = document.getElementById('chat-list-container');
                    snapshot.forEach((child) => {
                        if (child.key !== currentUser.username) {
                            container.innerHTML += `<div class="chat-item" style="border-left: 2px solid #4caf50;" onclick="switchChat('${child.key}', 'ЛС: ${child.key}')">👤 ${child.key} (${child.val().status})</div>`;
                        }
                    });
                });
            }
        }

        function switchChat(id, title) {
            currentChatId = id;
            document.getElementById('current-chat-title').innerText = title;
            listenToChat(id);
        }

        // Чтение и отправка сообщений с кастомизацией
        function listenToChat(id) {
            db.ref('messages/' + id).off();
            db.ref('messages/' + id).limitToLast(50).on('value', (snapshot) => {
                const container = document.getElementById('chat-messages-container');
                container.innerHTML = '';
                
                snapshot.forEach((child) => {
                    const msg = child.val();
                    const isMe = msg.sender === currentUser.username;
                    
                    let roleClass = 'role-user';
                    if (msg.role === 'owner') roleClass = 'role-owner';
                    else if (msg.role === 'admin') roleClass = 'role-admin';
                    else if (msg.role === 'premium') roleClass = 'role-premium';
                    else if (msg.role === 'vip') {
                        roleClass = msg.vipColor === 'green' ? 'role-vip-green' : 'role-vip-blue';
                    }

                    container.innerHTML += `
                        <div class="message ${isMe ? 'm-outgoing' : 'm-incoming'}" oncontextmenu="event.preventDefault(); forwardMessage('${msg.text}', '${msg.sender}')">
                            ${msg.isForwarded ? `<div class="fwd-label">Переслано от ${msg.fwdFrom}</div>` : ''}
                            <div class="msg-meta ${roleClass}">
                                <span>${msg.sender}</span> 
                                <span style="font-size:9px; color:gray;">[${msg.role.toUpperCase()}]</span>
                            </div>
                            <div class="msg-text">${msg.text}</div>
                        </div>
                    `;
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function sendChatMessage(fwdText = null, fwdFrom = null) {
            const input = document.getElementById('chat-message-input');
            const text = fwdText || input.value.trim();
            if (!text) return;

            const msgData = {
                sender: currentUser.username,
                role: currentUser.role,
                vipColor: currentUser.vipColor || 'none',
                text: text,
                timestamp: Date.now(),
                isForwarded: fwdText ? true : false,
                fwdFrom: fwdFrom || ''
            };

            db.ref('messages/' + currentChatId).push(msgData);
            if (!fwdText) input.value = '';
        }

        // Контекстная функция Telegram: Переслать сообщение (Вызывается по правому клику мыши на сообщение)
        function forwardMessage(text, from) {
            const target = prompt("Введите имя комнаты или ник игрока, куда переслать сообщение:");
            if (target) {
                const oldChat = currentChatId;
                currentChatId = target;
                sendChatMessage(text, from);
                currentChatId = oldChat;
                alert("Сообщение переслано!");
            }
        }

        // АДМИН-ФУНКЦИИ (Доступны только "неон" и назначенным админам)
        function adminCreateAccount() {
            if (currentUser.role !== 'owner' && currentUser.role !== 'admin') return alert("Нет прав!");
            const targetNick = prompt("Введите ник нового админа:");
            const targetPass = prompt("Введите пароль для админа:");
            if (!targetNick || !targetPass) return;

            db.ref('users/' + targetNick).set({
                username: targetNick,
                password: targetPass,
                role: 'admin',
                vipColor: 'none',
                ip: 'создан_админом',
                status: 'offline'
            });
            alert(`Аккаунт админа ${targetNick} успешно создан!`);
        }

        function adminGiveRole() {
            if (currentUser.role !== 'owner' && currentUser.role !== 'admin') return alert("Нет прав!");
            const targetNick = prompt("Введите ник игрока:");
            const newRole = prompt("Какую роль выдать? (vip / premium / admin):");
            if (!targetNick || !newRole) return;

            db.ref('users/' + targetNick + '/role').set(newRole);
            alert(`Роль игрока ${targetNick} изменена на ${newRole}!`);
        }
    </script>
</body>
</html>
