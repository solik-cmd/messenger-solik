<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Мессенджер</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        
        /* Панель подключения */
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-size: 14px; position: relative; }
        .connect-box { margin-top: 10px; display: flex; gap: 5px; justify-content: center; }
        input, button { padding: 8px; border: none; border-radius: 4px; font-size: 14px; }
        button { background: #128c7e; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #14a090; }

        /* Кнопка Выйти в шапке */
        .logout-btn { position: absolute; top: 12px; right: 15px; background: #d9534f; padding: 6px 12px; font-size: 12px; }
        .logout-btn:hover { background: #c9302c; }

        /* Экран авторизации (ввода ника) */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #e5ddd5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; z-index: 10; }
        #auth-screen div { font-size: 18px; color: #075e54; font-weight: bold; }
        #auth-screen input { border: 1px solid #ccc; width: 250px; padding: 10px; }

        /* Окно чата */
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 15px; word-break: break-word; }
        .me { background: #dcf8c6; align-self: flex-end; }
        .interlocutor { background: white; align-self: flex-start; }
        .system { background: #fff3cd; color: #856404; align-self: center; font-size: 12px; }

        /* Поле ввода сообщения */
        footer { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; }
        footer input { flex: 1; border: 1px solid #ccc; border-radius: 20px; padding: 10px 15px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div>Придумайте свой ник для чата:</div>
        <input type="text" id="my-username-input" placeholder="Например: ivan777" onkeypress="checkAuthEnter(event)">
        <button onclick="handleAuthSubmit()">Войти в мессенджер</button>
    </div>

    <header>
        <button class="logout-btn" onclick="logout()">Выйти</button>
        <div>Ваше имя для связи: <strong id="my-id">Ожидание входа...</strong></div>
        <div class="connect-box">
            <input type="text" id="peer-id-input" placeholder="Введите ник друга">
            <button onclick="connectToPeer()">Подключиться</button>
        </div>
    </header>

    <div id="chat-box">
        <div class="msg system">Скажите другу свой ник, либо введите его ник, чтобы начать общение.</div>
    </div>

    <footer>
        <input type="text" id="message-input" placeholder="Введите сообщение..." disabled onkeypress="checkEnter(event)">
        <button id="send-btn" onclick="sendMessage()" disabled>Отправить</button>
    </footer>

    <script>
        let peer = null; 
        let conn = null;
        let myName = "";
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        // Проверяем при запуске страницы, сохранен ли ник в браузере
        window.onload = function() {
            const savedName = localStorage.getItem('p2p_chat_username');
            if (savedName) {
                // Если нашли ник, сразу запускаем мессенджер с ним
                startMessenger(savedName);
            }
        };

        // Обработчик ручного ввода ника (кнопка Войти)
        function handleAuthSubmit() {
            const input = document.getElementById('my-username-input').value.trim();
            if (!input) return alert('Пожалуйста, введите ник!');
            
            // Сохраняем в память браузера
            localStorage.setItem('p2p_chat_username', input);
            startMessenger(input);
        }

        // Функция запуска мессенджера
        function startMessenger(username) {
            myName = username;
            document.getElementById('auth-screen').style.display = 'none'; // Скрываем экран входа

            // Создаем Peer с сохраненным именем (в нижнем регистре)
            peer = new Peer(myName.toLowerCase()); 

            // Ошибка, если ник занят
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert('Этот ник уже занят! Выберите другой.');
                    logout(); // Сбрасываем регистрацию, чтобы ввести заново
                } else {
                    alert('Ошибка сети: ' + err.type);
                }
            });

            // Отображаем ваш личный ник при успешной готовности сети
            peer.on('open', (id) => {
                document.getElementById('my-id').innerText = id;
            });

            // Слушаем входящие подключения
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                appendMessage('Система', `Пользователь ${conn.peer} подключился к вам!`, 'system');
            });
        }

        // Функция выхода из аккаунта
        function logout() {
            localStorage.removeItem('p2p_chat_username'); // Удаляем сохраненный ник из памяти
            if (peer) {
                peer.destroy(); // Закрываем все активные соединения PeerJS
            }
            location.reload(); // Перезагружаем страницу, чтобы вернуть форму ввода
        }

        // Функция инициализации связи при клике "Подключиться"
        function connectToPeer() {
            const peerId = document.getElementById('peer-id-input').value.trim().toLowerCase();
            if (!peerId) return alert('Введите ник друга!');
            if (peerId === myName.toLowerCase()) return alert('Нельзя подключиться к самому себе!');
            
            conn = peer.connect(peerId);
            setupConnection();
            appendMessage('Система', `Попытка подключиться к ${peerId}...`, 'system');
        }

        // Настройка отправки/приема сообщений
        function setupConnection() {
            conn.on('open', () => {
                msgInput.disabled = false;
                sendBtn.disabled = false;
                appendMessage('Система', 'Связь установлена! Приятного общения.', 'system');
            });

            conn.on('data', (data) => {
                appendMessage('Друг', data, 'interlocutor');
            });

            conn.on('close', () => {
                appendMessage('Система', 'Собеседник отключился.', 'system');
                msgInput.disabled = true;
                sendBtn.disabled = true;
            });
        }

        // Отправка текста
        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !conn) return;

            conn.send(text);
            appendMessage('Вы', text, 'me');
            msgInput.value = '';
        }

        function appendMessage(sender, text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg', type);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function checkAuthEnter(e) {
            if (e.key === 'Enter') handleAuthSubmit();
        }
    </script>
</body>
</html>
